name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the tag's ancestry is available for the main check below
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not reachable from main - release from main, not from a side branch"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME is on main"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync --frozen
      # Gate the release on the suite: a tag can point at anything, CI on the
      # branch it came from proves nothing about this exact commit.
      - name: Run tests
        run: uv run pytest -q
      # pyproject.toml is the only source of the version (see `mediakit -v`),
      # so a mismatched tag would publish a package labelled with a lie.
      - name: Verify tag matches pyproject version
        run: |
          uv run python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          if tag.removeprefix('v') != version:
              raise SystemExit(
                  f'tag {tag} does not match pyproject version {version}: bump '
                  f'[project].version in pyproject.toml before tagging'
              )
          print(f'tag {tag} matches pyproject version {version}')
          PY
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  binary:
    # Runs after the release job so the release (and its generated notes) already
    # exists; these legs only attach files to it.
    needs: release
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-latest
            asset: mediakit-macos-arm64
          # PyInstaller cannot cross-build a wheel-architecture mismatch, so Intel
          # macOS needs an Intel runner. macos-13 (the old label) was retired, and
          # a dead label queues forever - which also strands `homebrew`, since it
          # needs every leg of `binary` to finish.
          - target: macos-x86_64
            runner: macos-15-intel
            asset: mediakit-macos-x86_64
          - target: linux-x86_64
            runner: ubuntu-latest
            asset: mediakit-linux-x86_64
          - target: windows-x86_64
            runner: windows-latest
            asset: mediakit-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync --frozen
      # --with keeps pyinstaller out of pyproject/uv.lock (no lock churn) while
      # still building against the project's own environment and interpreter.
      - name: Build single-file binary
        run: uv run --with pyinstaller==6.22.3 pyinstaller --noconfirm mediakit.spec --distpath binary --workpath build-binary
      - name: Rename for the release asset
        shell: bash
        run: |
          mkdir -p asset
          if [ "${{ matrix.runner }}" = "windows-latest" ]; then
            mv binary/mediakit.exe "asset/${{ matrix.asset }}"
          else
            mv binary/mediakit "asset/${{ matrix.asset }}"
          fi
      # ffmpeg is deliberately NOT bundled: the binary shells out to a system
      # ffmpeg on PATH, same as the pip/uv install does.
      - name: Smoke test the binary
        shell: bash
        run: |
          "./asset/${{ matrix.asset }}" -v
          "./asset/${{ matrix.asset }}" --help > /dev/null
      - name: Attach binary to the release
        uses: softprops/action-gh-release@v3
        with:
          files: asset/${{ matrix.asset }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  homebrew:
    name: Update Homebrew tap formula
    # After the binary legs: this job hashes the assets they uploaded.
    needs: [binary]
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TAG: ${{ github.ref_name }}
      TAP_REPO: RedAtman/homebrew-tap
    steps:
      - name: Download release artifacts
        run: |
          mkdir -p artifacts
          for asset in mediakit-macos-arm64 mediakit-macos-x86_64 mediakit-linux-x86_64; do
            echo "Downloading $asset..."
            gh release download "$GH_TAG" \
              --repo "$GH_REPO" \
              --pattern "$asset" \
              --dir artifacts
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate formula
        run: |
          SHA256_MACOS_ARM64=$(sha256sum artifacts/mediakit-macos-arm64 | cut -d' ' -f1)
          SHA256_MACOS_X86_64=$(sha256sum artifacts/mediakit-macos-x86_64 | cut -d' ' -f1)
          SHA256_LINUX_X86_64=$(sha256sum artifacts/mediakit-linux-x86_64 | cut -d' ' -f1)
          cat > formula.rb << FORMULA
          class Mediakit < Formula
            desc "Python CLI tool for batch media operations"
            homepage "https://github.com/$GH_REPO"
            license "MIT"

            depends_on "ffmpeg"

            on_macos do
              on_arm do
                url "https://github.com/$GH_REPO/releases/download/$GH_TAG/mediakit-macos-arm64"
                sha256 "$SHA256_MACOS_ARM64"

                def install
                  bin.install "mediakit-macos-arm64" => "mediakit"
                end
              end
              on_intel do
                url "https://github.com/$GH_REPO/releases/download/$GH_TAG/mediakit-macos-x86_64"
                sha256 "$SHA256_MACOS_X86_64"

                def install
                  bin.install "mediakit-macos-x86_64" => "mediakit"
                end
              end
            end

            on_linux do
              url "https://github.com/$GH_REPO/releases/download/$GH_TAG/mediakit-linux-x86_64"
              sha256 "$SHA256_LINUX_X86_64"

              def install
                bin.install "mediakit-linux-x86_64" => "mediakit"
              end
            end

            test do
              system "#{bin}/mediakit", "-v"
            end
          end
          FORMULA
          CONTENT=$(base64 -w0 formula.rb)
          echo "FORMULA_CONTENT=$CONTENT" >> $GITHUB_ENV
      - name: Get current file SHA
        id: get_sha
        run: |
          SHA=$(gh api repos/$TAP_REPO/contents/Formula/mediakit.rb \
            --jq '.sha' 2>/dev/null || echo "")
          echo "CURRENT_SHA=$SHA" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Push formula to tap repo
        run: |
          jq -n \
            --arg msg "chore: update mediakit formula for $GH_TAG" \
            --arg content "$FORMULA_CONTENT" \
            --arg sha "$CURRENT_SHA" \
            '{message: $msg, content: $content, sha: $sha}' > payload.json
          gh api -X PUT repos/$TAP_REPO/contents/Formula/mediakit.rb \
            --input payload.json
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
