name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the tag's ancestry is available for the main check below
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not reachable from main - release from main, not from a side branch"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME is on main"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync --frozen
      # Gate the release on the suite: a tag can point at anything, CI on the
      # branch it came from proves nothing about this exact commit.
      - name: Run tests
        run: uv run pytest -q
      # pyproject.toml is the only source of the version (see `mediakit -v`),
      # so a mismatched tag would publish a package labelled with a lie.
      - name: Verify tag matches pyproject version
        run: |
          uv run python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          if tag.removeprefix('v') != version:
              raise SystemExit(
                  f'tag {tag} does not match pyproject version {version}: bump '
                  f'[project].version in pyproject.toml before tagging'
              )
          print(f'tag {tag} matches pyproject version {version}')
          PY
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  binary:
    # Runs after the release job so the release (and its generated notes) already
    # exists; these legs only attach files to it.
    needs: release
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-latest
            asset: mediakit-macos-arm64
          # PyInstaller cannot cross-build a wheel-architecture mismatch, so Intel
          # macOS needs an Intel runner. macos-13 (the old label) was retired, and
          # a dead label queues forever - which would leave a platform's asset
          # missing, so the tap's daily bump fails on the download.
          - target: macos-x86_64
            runner: macos-15-intel
            asset: mediakit-macos-x86_64
          - target: linux-x86_64
            runner: ubuntu-latest
            asset: mediakit-linux-x86_64
          - target: windows-x86_64
            runner: windows-latest
            asset: mediakit-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync --frozen
      # --with keeps pyinstaller out of pyproject/uv.lock (no lock churn) while
      # still building against the project's own environment and interpreter.
      - name: Build single-file binary
        run: uv run --with pyinstaller==6.22.3 pyinstaller --noconfirm mediakit.spec --distpath binary --workpath build-binary
      - name: Rename for the release asset
        shell: bash
        run: |
          mkdir -p asset
          if [ "${{ matrix.runner }}" = "windows-latest" ]; then
            mv binary/mediakit.exe "asset/${{ matrix.asset }}"
          else
            mv binary/mediakit "asset/${{ matrix.asset }}"
          fi
      # ffmpeg is deliberately NOT bundled: the binary shells out to a system
      # ffmpeg on PATH, same as the pip/uv install does.
      - name: Smoke test the binary
        shell: bash
        run: |
          "./asset/${{ matrix.asset }}" -v
          "./asset/${{ matrix.asset }}" --help > /dev/null
      - name: Attach binary to the release
        uses: softprops/action-gh-release@v3
        with:
          files: asset/${{ matrix.asset }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  notify-tap:
    name: Signal the Homebrew tap to bump
    # After every binary leg, so the assets the tap hashes already exist.
    needs: [binary]
    runs-on: ubuntu-latest
    steps:
      # Signal only: the tap owns its formulae and pulls the release itself,
      # so no asset checksum or formula text is written from here.
      - name: Dispatch a formula bump
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: gh api -X POST repos/RedAtman/homebrew-tap/dispatches -f event_type=formula-bump
