[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "config", "folder"]

[tool.setuptools.packages.find]
include = ["base*", "src*", "utils*", "tests*"]

[tool.pyright]
typeCheckingMode = "basic"


[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["docs/reference.py"]

[tool.ruff.lint]
select = ["F401", "F841", "I"]
fixable = ["F401", "F841", "I"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true


[tool.codespell]
check-filenames = ""
ignore-words-list = "word,another,something"
skip = "htmlcov,.doctrees,*.pyc,*.class,*.ico,*.out,*.PNG,*.inv,*.png,*.jpg,*.dot"

[project]
name = "mediakit"
version = "0.1.0"
description = "Python CLI tool for batch media operations"
authors = [{ name = "redatman", email = "evicwork@gmail.com" }]
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "requests==2.31.0",
    "sqlalchemy>=2.0.36",
    "sqlmodel>=0.0.34",
    "pygments==2.17.2",
    "pydantic>=2.11,<3",
    "psutil==7.0.0",
    "ffmpeg-python==0.2.0",
    # voice recognition
    "SpeechRecognition==3.10.1",
    "PyAudio==0.2.14",
    "pyttsx3==2.90",
    # MacOS seems to need this for pyttsx3
    # "pyobjc==9.0.1",
    "python-dotenv>=1.2.2",
    "watchdog>=6.0.0",
    "tqdm>=4.67",
]

[project.scripts]
mediakit = "cli:main"

[dependency-groups]
dev = [
    "codespell",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
    "vulture>=2.16",
]


[tool.uv.pip]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.uv]
package = true

[tool.pytest.ini_options]
minversion = "8.0.0"
pythonpath = ["."]
addopts = [
    "-vv",
    "--rootdir",
    ".",
    "-ra",
    "--color=yes",
    "--capture=tee-sys",
]
testpaths = ["tests", "./tests", "*/tests", "**/tests"]
python_files = ["test_*.py", "tests.py", "test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [
    ".vscode",
    "__pycache__",
    "node_modules",
    "venv",
    "env",
    "migrations",
    "static",
    "templates",
    "docs",
    "build",
    "dist",
    ".*",
]
filterwarnings = ["ignore::DeprecationWarning"]
